<section class="panel" id="library"><h2>跨平台档案与聚合</h2><p class="muted">明确引用同一仓库的内容并排展示。主题词匹配仅是候选线索，不等于AI推荐。最多扫描本地最近100条；不会重新采集平台。</p><p id="quota-summary" class="muted">正在读取批次日期的配额。</p><button id="library-refresh">刷新聚合</button><div id="library-results" role="status">等待读取本地档案。</div>
<form id="library-search-form"><div class="grid"><label>内容关键词<input id="library-query" maxlength="2000"></label><label>来源平台<select id="library-platform"><option value="">全部</option><option value="github">GitHub</option><option value="bilibili">Bilibili</option><option value="xiaohongshu">小红书</option></select></label><label>作者稳定ID<input id="library-author" maxlength="100" placeholder="UID / user_id / GitHub数字ID"></label><label>已有判断的主题<select id="library-topic"><option value="">全部</option></select></label><label>来源发布时间起点（北京时间，含）<input id="library-from" type="datetime-local"></label><label>来源发布时间终点（北京时间，不含）<input id="library-to" type="datetime-local"></label></div><button type="submit">按条件检索</button><p class="muted">时间条件按来源发布时间过滤；日期未知时不会用本地发现时间替代。主题筛选要求已有该主题判断，关键词聚合另见上方。</p></form><div id="library-search-results" role="status"></div></section>
<section class="panel" id="feedback"><h2>反馈与规则预览</h2><p class="muted">减少此类 / 不相关可添加字面排除词，作用于这个主题的各平台。先预览，再应用；撤销不会覆盖后续手动修改。有用 / 重复只记录意见。</p><form id="feedback-form"><div class="grid"><label>条目ID<input id="feedback-item" required maxlength="300" placeholder="从档案条目选择"></label><label>主题<select id="feedback-topic" required></select></label><label>反馈类型<select id="feedback-kind"><option value="less_like_this">减少此类</option><option value="irrelevant">不相关</option><option value="useful">有用</option><option value="duplicate">重复线索</option></select></label><label>拟排除词或反馈说明<input id="feedback-rule" required maxlength="2000" placeholder="拟排除词最多200字符"></label></div><button type="submit">保存反馈并预览</button></form><div id="feedback-preview" role="status"></div><button id="feedback-refresh">刷新反馈记录</button><div id="feedback-history"></div></section>
